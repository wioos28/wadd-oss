[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-engine"
version = "0.1.0"
description = "A local-first, offline-capable Knowledge Engine CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Knowledge Engine Contributors" }]
keywords = ["knowledge", "ai", "cli", "vector-search", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "requests>=2.31.0",
    "netifaces>=0.11.0",
]

[project.optional-dependencies]
code = ["tree-sitter>=0.22.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5.0"]

[project.scripts]
ke = "ke.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ke"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
