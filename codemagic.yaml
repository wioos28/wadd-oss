workflows:
  ke-app-ios:
    name: Build Unsigned IPA Wcore X
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Fix paths & Install dependencies
        script: |
          echo "Fixing file path mismatch..."
          # Tạo đường dẫn liên kết để Xcode tìm thấy file
          ln -sf $CM_BUILD_DIR/ios-app/KEApp $CM_BUILD_DIR/KEApp

          cd ios-app
          echo "Resolving Swift Package Manager dependencies..."
          swift package resolve

      - name: Build Archive (No Signing)
        script: |
          echo "Building Xcode Archive without code signing..."
          mkdir -p $HOME/build
          cd ios-app
          xcodebuild -project KEApp.xcodeproj \
            -scheme KEApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath $HOME/build/KEApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA
        script: |
          echo "Creating Payload folder and zipping into IPA..."
          cd $HOME/build
          mkdir -p Payload
          cp -r KEApp.xcarchive/Products/Applications/KEApp.app Payload/
          zip -r KEApp.ipa Payload

    artifacts:
      - $HOME/build/KEApp.ipa
