# Codemagic CI/CD Configuration for ProCameraApp
# https://docs.codemagic.io/getting-started/yaml/

workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    environment:
      ios_signing:
        configuration: Release
      vars:
        BUNDLE_ID: com.procamera.app
    scripts:
      - name: Install dependencies
        script: |
          cd ios
          pod install --repo-update || echo "No CocoaPods, skipping"
      - name: Set up Flutter (if using Flutter)
        script: |
          cd ios
          # Add any additional setup here
      - name: Build iOS
        script: |
          cd ios
          xcodebuild \
            -project ProCameraApp.xcodeproj \
            -scheme ProCameraApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/ProCameraApp.xcarchive \
            archive
      - name: Export IPA
        script: |
          cd ios
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/build/ProCameraApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/output
    artifacts:
      - build/ios/output/*.ipa
