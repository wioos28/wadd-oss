# Codemagic CI/CD Configuration for ProCameraApp
# https://docs.codemagic.io/getting-started/yaml/

workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    scripts:
      - name: Build iOS
        script: |
          xcodebuild \
            -project ProCameraApp.xcodeproj \
            -scheme ProCameraApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/ProCameraApp.xcarchive \
            archive
      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/build/ProCameraApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/output
    artifacts:
      - build/ProCameraApp.xcarchive
      - output/*.ipa

  ios-debug:
    name: iOS Debug Build
    max_build_duration: 30
    scripts:
      - name: Build iOS Debug
        script: |
          xcodebuild \
            -project ProCameraApp.xcodeproj \
            -scheme ProCameraApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build
    artifacts:
      - build/Debug-iphonesimulator/*.app

  ios-test:
    name: iOS Tests
    max_build_duration: 45
    scripts:
      - name: Run Unit Tests
        script: |
          xcodebuild \
            -project ProCameraApp.xcodeproj \
            -scheme ProCameraApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            test
    artifacts:
      - build/logs/*.xcresult

trigger:
  events:
    - push
    - pull_request
  branch_patterns:
    - pattern: 'main'
      include: true
      source: true
    - pattern: 'develop'
      include: true
      source: true
    - pattern: 'feature/*'
      include: true
      source: true
  tag_patterns:
    - pattern: 'v*'
      include: true

cache:
  cache_paths:
    - ~/Library/Caches/CocoaPods
    - ~/Library/Caches/com.apple.dt.Xcode
