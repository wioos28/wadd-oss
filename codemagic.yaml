workflows:
  ke-app-ios:
    name: KE App iOS
    max_build_duration: 60
    instance_type: mac_mini_m1

    # Set working directory to ios-app
    working_directory: ios-app

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Install dependencies (SPM)
        script: |
          echo "Resolving Swift Package Manager dependencies..."
          swift package resolve

      - name: Build iOS App
        script: |
          echo "Building iOS App..."
          xcodebuild -scheme KEApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/build/KEApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/KEApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/build/ios

    artifacts:
      - build/ios/*.ipa
      - build/ios/**/*.xcarchive

    cache:
      cache_paths:
        - .build
