workflows:
  ke-app-ios:
    name: KE App iOS
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: |
          cd ios-app
          pod install --repo-update
      - name: Build iOS (No Code Sign)
        script: |
          xcodebuild -workspace ios-app/KEApp.xcworkspace \
            -scheme KEApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/build/KEApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Export IPA (No Sign)
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/KEApp.xcarchive \
            -exportOptionsPlist ios-app/ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/build/ios \
            -exportArchiveOptionsPlist ios-app/ExportOptions.plist
    artifacts:
      - build/ios/*.ipa
      - build/ios/**/*.xcarchive
    cache:
      cache_paths:
        - ~/Library/Caches/CocoaPods
        - ios-app/Pods
