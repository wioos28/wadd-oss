workflows:
  ios-release:
    name: Build iOS ProCameraApp
    environment:
      xcode: latest
    scripts:
      - name: Build iOS
        script: |
          # Tự động tìm file xcodeproj trong mã nguồn được clone về
          PROJECT_PATH=$(find . -name "ProCameraApp.xcodeproj" -maxdepth 4 | head -n 1)

          if [ -z "$PROJECT_PATH" ]; then
            echo "Lỗi: Không tìm thấy file ProCameraApp.xcodeproj"
            exit 1
          fi

          # Chuyển vào đúng thư mục chứa project để build
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"

          # Thực hiện lệnh build/archive
          xcodebuild -project ProCameraApp.xcodeproj -scheme ProCameraApp -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -archivePath $HOME/clone/build/ProCameraApp.xcarchive archive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $HOME/clone/build/ProCameraApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $HOME/clone/build/ipa
    artifacts:
      - $HOME/clone/build/ProCameraApp.xcarchive
      - $HOME/clone/build/ipa/*.ipa

trigger:
  events:
    - push
  branch_patterns:
    - pattern: 'main'
      include: true
      source: true
