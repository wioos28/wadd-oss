workflows:
  ke-app-ios:
    name: KE App iOS
    max_build_duration: 60
    environment:
      groups:
        - apple_credentials
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: |
          cd ios-app
          pod install --repo-update
      - name: Build iOS
        script: |
          xcodebuild -workspace ios-app/KEApp.xcworkspace \
            -scheme KEApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/build/KEApp.xcarchive \
            archive
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/KEApp.xcarchive \
            -exportOptionsPlist ci-cd/ios/ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/build/ios
    artifacts:
      - build/ios/*.ipa
      - build/ios/**/*.xcarchive
    publishing:
      email:
        recipients:
          - team@example.com
        subject: "Build {{build_number}} completed"
        body: |
          Build {{build_number}} of KE App iOS completed successfully.
          
          Branch: {{branch}}
          Commit: {{commit}}
          
          Download artifact from: {{build_url}}
      app_store_connect:
        api_key: $APPLE_CONNECT_API_KEY
        key_id: $APPLE_CONNECT_API_KEY_ID
        issuer_id: $APPLE_CONNECT_API_ISSUER_ID
    cache:
      cache_paths:
        - ~/Library/Caches/CocoaPods
        - ios-app/Pods

  ke-app-ios-testflight:
    name: KE App iOS - TestFlight
    max_build_duration: 60
    environment:
      groups:
        - apple_credentials
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          cd ios-app
          pod install --repo-update
      - name: Build iOS
        script: |
          xcodebuild -workspace ios-app/KEApp.xcworkspace \
            -scheme KEApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/build/KEApp.xcarchive \
            archive
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/KEApp.xcarchive \
            -exportOptionsPlist ci-cd/ios/ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/build/ios
    artifacts:
      - build/ios/*.ipa
    publishing:
      app_store_connect:
        api_key: $APPLE_CONNECT_API_KEY
        key_id: $APPLE_CONNECT_API_KEY_ID
        issuer_id: $APPLE_CONNECT_API_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - team@example.com
        subject: "TestFlight Build {{build_number}}"
    cache:
      cache_paths:
        - ~/Library/Caches/CocoaPods
        - ios-app/Pods
